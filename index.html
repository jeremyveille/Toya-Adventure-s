<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>RPG - Akira Toriyama Style</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
        }

        h1 {
            font-size: 24px;
            text-shadow: 2px 2px 0 #ff00ff, -2px -2px 0 #00ffff;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        canvas {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 255, 255, 0.4);
            border: 4px solid #fff;
            border-radius: 8px;
            image-rendering: pixelated;
            position: relative;
            z-index: 1;
        }

        #game-container {
            position: relative;
        }

        /* Scanlines effet CRT */
        #game-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0),
                rgba(255, 255, 255, 0) 50%,
                rgba(0, 0, 0, 0.2) 50%,
                rgba(0, 0, 0, 0.2)
            );
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
            border-radius: 8px;
        }

        .controls {
            margin-top: 20px;
            font-size: 10px;
            color: #aaa;
            text-align: center;
            line-height: 1.8;
            text-shadow: 1px 1px 0 #000;
        }

        @keyframes pulse {
            0% { transform: scale(1); text-shadow: 2px 2px 0 #ff00ff, -2px -2px 0 #00ffff; }
            50% { transform: scale(1.02); text-shadow: 4px 4px 0 #ff00ff, -4px -4px 0 #00ffff; }
            100% { transform: scale(1); text-shadow: 2px 2px 0 #ff00ff, -2px -2px 0 #00ffff; }
        }
    </style>
</head>
<body>
    <h1>RPG - L'Éveil</h1>
    <div id="game-container"></div>
    <div class="controls">
        [Z,Q,S,D] : Déplacement | [ESPACE] : Attaquer<br>
        [E] : Interagir | [I] : Inventaire | [J] : Quêtes | [C] : Crafting
    </div>
    <!-- Scripts of the game scenes and classes -->
    <script src="src/managers/GameManager.js"></script>
    <script src="src/classes/Player.js"></script>
    <script src="src/classes/Enemy.js"></script>
    <script src="src/maps/maps.js"></script>
    <script src="src/scenes/WorldScene.js"></script>
    <script src="src/scenes/BattleScene.js"></script>
    <script src="src/scenes/UIScene.js"></script>
    <script src="src/scenes/HUDScene.js"></script>
    
    <!-- Main game configuration -->
    <script src="main.js"></script>
</body>
</html>
